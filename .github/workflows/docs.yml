name: Build Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '!docs/book/**'
  workflow_dispatch:

concurrency:
  group: docs-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Build documentation
        run: |
          cd docs
          mdbook build
          touch book/.nojekyll

      - name: Upload generated documentation
        uses: actions/upload-artifact@v4
        with:
          name: DuckPort-documentation
          path: docs/book/
